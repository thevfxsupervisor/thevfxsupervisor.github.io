<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" role="img"
     aria-labelledby="sbTitle sbDesc" width="100%" height="auto">
  <title id="sbTitle">How signalbox builds a shot</title>
  <desc id="sbDesc">The tracker holds the assets, shots, beats and prompt fragments. signalbox builds
  the shot from those connections. The result publishes as a Version in the normal review process.
  A reviewer's note is read by an LLM, which adjusts the prompt or the asset connections and renders
  four to eight variations, and those publish back into the same review.</desc>

  <defs>
    <marker id="sbArrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0585f8"/>
    </marker>
    <marker id="sbArrowGreen" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5ad3c0"/>
    </marker>
    <style>
      .sb-box  { fill:#191d21; stroke:#2a3037; stroke-width:1.5; }
      .sb-gate { fill:#191d21; stroke:#5ad3c0; stroke-width:1.5; }
      .sb-t    { fill:#e9e6df; font-size:19px; font-weight:600; }
      .sb-s    { fill:#9aa1a8; font-size:15px; }
      text     { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
    </style>
  </defs>

  <rect class="sb-box" x="120" y="16"  width="400" height="66" rx="8"/>
  <text class="sb-t" x="144" y="44">The tracker</text>
  <text class="sb-s" x="144" y="67">assets, shots, beats, prompt fragments</text>

  <rect class="sb-box" x="120" y="136" width="400" height="66" rx="8"/>
  <text class="sb-t" x="144" y="164">signalbox builds the shot</text>
  <text class="sb-s" x="144" y="187">from connections already in there</text>

  <rect class="sb-box" x="120" y="256" width="400" height="66" rx="8"/>
  <text class="sb-t" x="144" y="284">Versions publish for review</text>
  <text class="sb-s" x="144" y="307">the usual process, no new tool</text>

  <rect class="sb-gate" x="120" y="376" width="400" height="66" rx="8"/>
  <text class="sb-t" x="144" y="404">A note asks for a change</text>
  <text class="sb-s" x="144" y="427">an LLM renders 4 to 8 variations</text>

  <path d="M 320 82  L 320 130" stroke="#0585f8" stroke-width="2" fill="none" marker-end="url(#sbArrow)"/>
  <path d="M 320 202 L 320 250" stroke="#0585f8" stroke-width="2" fill="none" marker-end="url(#sbArrow)"/>
  <path d="M 320 322 L 320 370" stroke="#5ad3c0" stroke-width="2" fill="none" marker-end="url(#sbArrowGreen)"/>

  <path d="M 120 409 L 76 409 Q 56 409 56 389 L 56 309 Q 56 289 76 289 L 114 289"
        stroke="#5ad3c0" stroke-width="2" fill="none" stroke-dasharray="5 4"
        marker-end="url(#sbArrowGreen)"/>
</svg>
